{% extends "base.html" %}
{% block title %}Edit Task{% endblock %}
{% block content %}
  <header>
    <h1>Edit Task</h1>
  </header>

  <form class="edit-form" action="{{ url_for('edit_task', task_id=task.id) }}" method="post">
    <label>
      Title
      <input type="text" name="title" value="{{ task.title }}" required>
    </label>
    <label>
      Notes
      <textarea name="notes" rows="3">{{ task.notes }}</textarea>
    </label>
    <label>
      Priority
      <select name="priority">
        {% for p in priorities %}
          <option value="{{ p }}" {{ 'selected' if task.priority == p else '' }}>{{ p|capitalize }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Due date
      <input type="date" name="due_date" value="{{ task.due_date or '' }}">
    </label>
    <div class="edit-actions">
      <button type="submit">Save</button>
      <a href="{{ url_for('index') }}" class="cancel-link">Cancel</a>
    </div>
  </form>
{% endblock %}
