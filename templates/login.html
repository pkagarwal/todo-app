{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
  <header class="page-header">
    <h1>Log In</h1>
  </header>

  <form class="edit-form" action="{{ url_for('login', next=request.args.get('next')) }}" method="post">
    {% if error %}
      <p class="stats">{{ error }}</p>
    {% endif %}
    <label>
      Username
      <input type="text" name="username" required autofocus>
    </label>
    <label>
      Password
      <input type="password" name="password" required>
    </label>
    <div class="edit-actions">
      <button type="submit">Log In</button>
    </div>
  </form>
{% endblock %}
